configuration:
  token:
    name: API token
    description: Required bearer token. Use a long random value and keep it equal to the Home Assistant lds_token secret.
  timezone:
    name: Lab timezone
    description: Timezone used for timestamps, for example Asia/Kolkata.
  ha_base_url:
    name: Home Assistant URL
    description: Base URL used by QR labels for the lab-scan redirect.
  autoclave_default_temperature_c:
    name: Default autoclave temperature
    description: Temperature in degrees Celsius used when a cycle does not override it.
  autoclave_default_pressure_psi:
    name: Default autoclave pressure
    description: Pressure in psi used when a cycle does not override it.
  autoclave_default_duration_min:
    name: Default autoclave duration
    description: Duration in minutes used for jars and other items when a cycle does not override it.
  dark_room_temperature_entity:
    name: Dark room temperature entity
    description: Optional Home Assistant Entity ID, such as sensor.dark_room_temperature. Leave empty if unavailable.
  dark_room_humidity_entity:
    name: Dark room humidity entity
    description: Optional percentage sensor Entity ID.
  dark_room_co2_entity:
    name: Dark room CO2 entity
    description: Optional carbon-dioxide sensor Entity ID.
  dark_room_lux_entity:
    name: Dark room illuminance entity
    description: Optional lux sensor Entity ID.
  dark_room_light_entity:
    name: Dark room light entity
    description: Optional light or switch Entity ID.
  dark_room_door_entity:
    name: Dark room door entity
    description: Optional door binary-sensor Entity ID.
