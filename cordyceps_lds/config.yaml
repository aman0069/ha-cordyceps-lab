# Cordyceps Lab Data Service — App (add-on) configuration
# Verified against: HA Core 2026.8.3 / Supervisor 2026.07.5 / HAOS 18.2
#
# NOTE: Supervisor recursively searches an app repository for `config.yaml`.
# Do not add another file named config.yaml anywhere inside this folder.
name: Cordyceps Lab Data Service
slug: cordyceps_lds
version: "2.1.1"
description: FastAPI and SQLite batch, jar, and stage tracking service for Cordyceps Lab v2
url: https://github.com/aman0069/ha-cordyceps-lab

# Only what the base image can actually build for. ghcr.io/home-assistant/base
# publishes linux/amd64 and linux/arm64 ONLY — listing armv7/armhf/i386 here
# would let Supervisor start a build that cannot possibly resolve a base image.
arch:
  - amd64
  - aarch64

# Required for S6 Overlay v3 base images — the app will not start if this is true.
init: false
startup: services
boot: auto

ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Lab Data Service REST API and QR token redirect

# /health is unauthenticated on purpose so the Supervisor watchdog can poll it.
watchdog: "http://[HOST]:[PORT:8099]/health"

options:
  token: ""
  timezone: Asia/Kolkata
  ha_base_url: "http://homeassistant.local:8123"
schema:
  token: str
  timezone: str
  # Where /s/<token> redirects the tablet. Change this here — never on the
  # printed labels — if the Home Assistant web server port ever changes.
  ha_base_url: str

map:
  - config:rw
  - share:rw
