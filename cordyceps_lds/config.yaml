# Cordyceps Lab Data Service — App (add-on) configuration
# Verified against: HA Core 2026.8.3 / Supervisor 2026.07.5 / HAOS 18.2
#
# NOTE: Supervisor recursively searches an app repository for `config.yaml`.
# Do not add another file named config.yaml anywhere inside this folder.
name: Cordyceps Lab Data Service
slug: cordyceps_lds
version: "2.4.0"
description: FastAPI and SQLite batch, jar, and stage tracking service for Cordyceps Lab v2
url: https://github.com/aman0069/ha-cordyceps-lab

# Only what the base image can actually build for. ghcr.io/home-assistant/base
# publishes linux/amd64 and linux/arm64 ONLY — listing armv7/armhf/i386 here
# would let Supervisor start a build that cannot possibly resolve a base image.
arch:
  - amd64
  - aarch64

# Required for S6 Overlay v3 base images — the app will not start if this is true.
init: false
startup: services
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:mushroom-outline
panel_title: Cordyceps Lab

# PORT MAPPING: "<container port>/tcp: <host port>".
#
# The container keeps 8099 because that is the Home Assistant convention, and
# nothing on the host can collide with a container-internal port. Home Assistant
# itself reaches this service over the Docker network at
# http://<slug-prefix>-cordyceps_lds:8099, so HA never needs the host port.
#
# The HOST port is deliberately 8189, NOT 8099. Port 8099 is the documented
# default `ingress_port` for Home Assistant apps, which makes it the most
# contested port in the ecosystem — Zigbee2MQTT pins its frontend to it, and the
# SSH/Terminal and File Editor apps serve their UIs on it. Publishing 8099 on
# the host is close to guaranteeing a conflict.
#
# The host port is ONLY needed so the lab tablet can follow a scanned QR label.
# It is baked into every printed label, so treat it as permanent once you print
# at scale. It can be changed in the app's Network section — see README section 3.
ports:
  8099/tcp: 8189
ports_description:
  8099/tcp: QR label redirect and REST API, reachable from the lab tablet

# /health is unauthenticated on purpose so the Supervisor watchdog can poll it.
# [PORT:8099] resolves to whichever host port is mapped above.
watchdog: "http://[HOST]:[PORT:8099]/health"

