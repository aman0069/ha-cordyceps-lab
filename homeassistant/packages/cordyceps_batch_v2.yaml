# REST commands have templated endpoint variables. Every invocation below passes
# lds_base_url: !secret lds_base_url and lds_token: !secret lds_token, so URL and
# Authorization are never hard-coded in this package.
rest_command:
  cm2_resolve:
    url: "{{ lds_base_url }}/resolve?t={{ token | urlencode }}"
    method: GET
    headers:
      Authorization: "Bearer {{ lds_token }}"
      Accept: application/json
    verify_ssl: false
  cm2_post_event:
    url: "{{ lds_base_url }}/events"
    method: POST
    headers:
      Authorization: "Bearer {{ lds_token }}"
      Content-Type: application/json
      Accept: application/json
    payload: "{{ payload }}"
    verify_ssl: false
  cm2_post_transfer:
    url: "{{ lds_base_url }}/events/transfer"
    method: POST
    headers:
      Authorization: "Bearer {{ lds_token }}"
      Content-Type: application/json
      Accept: application/json
    payload: "{{ payload }}"
    verify_ssl: false
  cm2_post_observation:
    url: "{{ lds_base_url }}/observations"
    method: POST
    headers:
      Authorization: "Bearer {{ lds_token }}"
      Content-Type: application/json
      Accept: application/json
    payload: "{{ payload }}"
    verify_ssl: false
  cm2_post_intervention:
    url: "{{ lds_base_url }}/interventions"
    method: POST
    headers:
      Authorization: "Bearer {{ lds_token }}"
      Content-Type: application/json
      Accept: application/json
    payload: "{{ payload }}"
    verify_ssl: false
  cm2_post_harvest:
    url: "{{ lds_base_url }}/harvest"
    method: POST
    headers:
      Authorization: "Bearer {{ lds_token }}"
      Content-Type: application/json
      Accept: application/json
    payload: "{{ payload }}"
    verify_ssl: false
  cm2_post_cost:
    url: "{{ lds_base_url }}/costs"
    method: POST
    headers:
      Authorization: "Bearer {{ lds_token }}"
      Content-Type: application/json
      Accept: application/json
    payload: "{{ payload }}"
    verify_ssl: false
  cm2_create_batch:
    url: "{{ lds_base_url }}/batches"
    method: POST
    headers:
      Authorization: "Bearer {{ lds_token }}"
      Content-Type: application/json
      Accept: application/json
    payload: "{{ payload }}"
    verify_ssl: false
  cm2_summarize:
    url: "{{ lds_base_url }}/env/summarize"
    method: POST
    headers:
      Authorization: "Bearer {{ lds_token }}"
      Content-Type: application/json
      Accept: application/json
    payload: "{{ payload }}"
    verify_ssl: false

# Poll LDS rather than Home Assistant history. The data source is LDS /batches
# and /batches/{id}/timeline, refreshed every 60 seconds for dashboard use.
rest:
  - resource_template: >-
      {{ state_attr('sensor.cm2_lds_connection', 'base_url') ~ '/health' }}
    method: GET
    headers:
      Authorization: >-
        Bearer {{ state_attr('sensor.cm2_lds_connection', 'bearer_token') }}
      Accept: application/json
    verify_ssl: false
    scan_interval: 60
    sensor:
      - name: "CM2 LDS status"
        unique_id: cm2_lds_status
        value_template: >-
          {{ value_json.get('status', 'online') if value_json is mapping else 'online' }}

  - resource_template: >-
      {{ state_attr('sensor.cm2_lds_connection', 'base_url') ~ '/batches?stage=dark_incubation&limit=200' }}
    method: GET
    headers:
      Authorization: >-
        Bearer {{ state_attr('sensor.cm2_lds_connection', 'bearer_token') }}
      Accept: application/json
    verify_ssl: false
    scan_interval: 60
    sensor:
      - name: "CM2 dark transfer queue data"
        unique_id: cm2_dark_transfer_queue_data
        value_template: >-
          {% if value_json is mapping %}
            {{ value_json.get('batches', value_json.get('items', [])) | count }}
          {% else %}{{ value_json | count }}{% endif %}
        json_attributes:
          - batches
          - items

  - resource_template: >-
      {% set selected = states('input_text.cm2_selected_id') | trim %}
      {% set batch = selected.split('-J')[0] if '-J' in selected else selected %}
      {{ state_attr('sensor.cm2_lds_connection', 'base_url') ~ '/batches/' ~ batch ~ '/timeline' }}
    method: GET
    headers:
      Authorization: >-
        Bearer {{ state_attr('sensor.cm2_lds_connection', 'bearer_token') }}
      Accept: application/json
    verify_ssl: false
    scan_interval: 60
    sensor:
      - name: "CM2 selected timeline"
        unique_id: cm2_selected_timeline
        value_template: >-
          {% if value_json is mapping %}
            {{ value_json.get('current_stage', value_json.get('batch', {}).get('current_stage', 'unknown')) }}
          {% else %}unknown{% endif %}
        json_attributes:
          - batch_id
          - current_stage
          - durations
          - stage_durations
          - completeness
          - batch

script:
  cm2_reset_form:
    alias: "CM2 · Clear scan action form"
    icon: mdi:eraser
    mode: single
    sequence:
      - action: input_text.set_value
        target:
          entity_id:
            - input_text.cm2_scan_payload
            - input_text.cm2_selected_id
            - input_text.cm2_selected_name
            - input_text.cm2_rack_shelf
            - input_text.cm2_notes
            - input_text.cm2_reason
            - input_text.cm2_intervention_detail
            - input_text.cm2_cost_item
            - input_text.cm2_cost_unit
        data:
          value: ""
      - action: input_select.select_option
        target:
          entity_id: input_select.cm2_pending_action
        data:
          option: none
      - action: input_select.select_option
        target:
          entity_id: input_select.cm2_transfer_step
        data:
          option: scan
      - action: input_select.select_option
        target:
          entity_id:
            - input_select.cm2_dest_chamber
            - input_select.cm2_source_location
        data:
          option: "-- select chamber --"
      - action: input_select.select_option
        target:
          entity_id: input_select.cm2_moisture_level
        data:
          option: "-- select moisture --"
      - action: input_number.set_value
        target:
          entity_id: input_number.cm2_colonization_pct
        data:
          value: 0

  cm2_resolve_scan:
    alias: "CM2 · Resolve scan and arm confirmation"
    icon: mdi:qrcode-scan
    mode: restart
    sequence:
      - variables:
          raw_payload: "{{ states('input_text.cm2_scan_payload') | trim }}"
          token: >-
            {% set found = raw_payload | regex_findall('(?:[?&]t=)([^&#]+)') %}
            {{ found[0] if found | count > 0 else raw_payload }}
      - choose:
          - conditions: "{{ token | trim == '' }}"
            sequence:
              - action: persistent_notification.create
                data:
                  title: "CM2 scan not resolved"
                  message: "No token or /lab-scan?t= URL was supplied. No LDS record was changed."
                  notification_id: cm2_scan_resolve_error
              - stop: "Blank scan payload; confirmation remains disarmed." 
      - action: rest_command.cm2_resolve
        data:
          lds_base_url: !secret lds_base_url
          lds_token: !secret lds_token
          token: "{{ token | trim }}"
        response_variable: resolve_response
      - variables:
          resolve_body: >-
            {% set content = resolve_response.content | default('{}', true) %}
            {{ content if content is mapping else content | from_json({}) }}
      - choose:
          - conditions: >-
              {{ resolve_response.status | default(0) | int in [200, 201]
                 and resolve_body is mapping
                 and (resolve_body.get('jar_id') or resolve_body.get('batch_id')) }}
            sequence:
              - variables:
                  resolved_id: "{{ resolve_body.get('jar_id') or resolve_body.get('batch_id') }}"
                  resolved_name: >-
                    {{ (resolve_body.get('jar_id') or resolve_body.get('batch_id')) ~ ' · ' ~
                       resolve_body.get('strain', 'unknown strain') ~ ' · ' ~
                       resolve_body.get('current_stage', 'unknown stage') ~ ' · ' ~
                       resolve_body.get('current_location', 'unknown location') }}
              - action: input_text.set_value
                target:
                  entity_id: input_text.cm2_selected_id
                data:
                  value: "{{ resolved_id }}"
              - action: input_text.set_value
                target:
                  entity_id: input_text.cm2_selected_name
                data:
                  value: "{{ resolved_name }}"
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.cm2_scan_confirm_armed
              - action: input_select.select_option
                target:
                  entity_id: input_select.cm2_pending_action
                data:
                  option: transfer_dark_to_light
              - action: input_select.select_option
                target:
                  entity_id: input_select.cm2_transfer_step
                data:
                  option: action
          - conditions: []
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.cm2_scan_confirm_armed
              - action: persistent_notification.create
                data:
                  title: "CM2 scan not resolved"
                  message: >-
                    LDS could not resolve this token (HTTP {{ resolve_response.status | default('no response', true) }}).
                    Confirmation was not armed and no record was changed.
                  notification_id: cm2_scan_resolve_error

  cm2_next_transfer_task:
    alias: "CM2 · Complete current transfer task"
    icon: mdi:arrow-right-circle-outline
    mode: single
    sequence:
      - variables:
          step: "{{ states('input_select.cm2_transfer_step') }}"
          operator: "{{ states('input_select.cm2_operator') }}"
          source_location: "{{ states('input_select.cm2_source_location') }}"
          dest_chamber: "{{ states('input_select.cm2_dest_chamber') }}"
          rack_shelf: "{{ states('input_text.cm2_rack_shelf') | trim }}"
          reason: "{{ states('input_text.cm2_reason') | trim }}"
          colonization: "{{ states('input_number.cm2_colonization_pct') }}"
          moisture_level: "{{ states('input_select.cm2_moisture_level') }}"
          missing: >-
            {% if step == 'action' and states('input_select.cm2_pending_action') != 'transfer_dark_to_light' %}dark-to-light transfer action
            {% elif step == 'operator' and operator in ['', 'unknown', 'unavailable', 'none', '-- select operator --'] %}operator
            {% elif step == 'source' and source_location in ['', 'unknown', 'unavailable', 'none', '-- select chamber --'] %}source location
            {% elif step == 'destination' and dest_chamber in ['', 'unknown', 'unavailable', 'none', '-- select chamber --'] %}destination chamber
            {% elif step == 'rack' and rack_shelf in ['', 'unknown', 'unavailable', 'none'] %}rack / shelf
            {% elif step == 'reason' and reason in ['', 'unknown', 'unavailable', 'none'] %}reason
            {% elif step == 'colonization' and colonization in ['', 'unknown', 'unavailable', 'none'] %}colonization %
            {% elif step == 'moisture' and moisture_level in ['', 'unknown', 'unavailable', 'none', '-- select moisture --'] %}moisture level
            {% endif %}
      - choose:
          - conditions: "{{ missing | trim != '' }}"
            sequence:
              - action: persistent_notification.create
                data:
                  title: "CM2 task required"
                  message: "Complete {{ missing }} before continuing. No event was changed."
                  notification_id: cm2_transfer_task_required
              - stop: "Current transfer task is incomplete."
      - choose:
          - conditions: "{{ step == 'action' }}"
            sequence:
              - action: input_select.select_option
                target: {entity_id: input_select.cm2_transfer_step}
                data: {option: operator}
          - conditions: "{{ step == 'operator' }}"
            sequence:
              - action: input_select.select_option
                target: {entity_id: input_select.cm2_transfer_step}
                data: {option: source}
          - conditions: "{{ step == 'source' }}"
            sequence:
              - action: input_select.select_option
                target: {entity_id: input_select.cm2_transfer_step}
                data: {option: destination}
          - conditions: "{{ step == 'destination' }}"
            sequence:
              - action: input_select.select_option
                target: {entity_id: input_select.cm2_transfer_step}
                data: {option: rack}
          - conditions: "{{ step == 'rack' }}"
            sequence:
              - action: input_select.select_option
                target: {entity_id: input_select.cm2_transfer_step}
                data: {option: reason}
          - conditions: "{{ step == 'reason' }}"
            sequence:
              - action: input_select.select_option
                target: {entity_id: input_select.cm2_transfer_step}
                data: {option: colonization}
          - conditions: "{{ step == 'colonization' }}"
            sequence:
              - action: input_select.select_option
                target: {entity_id: input_select.cm2_transfer_step}
                data: {option: moisture}
          - conditions: "{{ step == 'moisture' }}"
            sequence:
              - action: input_select.select_option
                target: {entity_id: input_select.cm2_transfer_step}
                data: {option: environment}
          - conditions: "{{ step == 'environment' }}"
            sequence:
              - action: input_select.select_option
                target: {entity_id: input_select.cm2_transfer_step}
                data: {option: confirm}

  cm2_confirm_and_commit:
    alias: "CM2 · Confirm and commit armed scan action"
    icon: mdi:check-decagram-outline
    mode: single
    sequence:
      - variables:
          armed: "{{ is_state('input_boolean.cm2_scan_confirm_armed', 'on') }}"
          selected_id: "{{ states('input_text.cm2_selected_id') | trim }}"
      - choose:
          - conditions: "{{ not armed or selected_id == '' }}"
            sequence:
              - action: persistent_notification.create
                data:
                  title: "CM2 commit refused"
                  message: "Resolve a scan and confirm within the 120-second window before committing. No LDS record was changed."
                  notification_id: cm2_commit_refused
              - stop: "Scan confirmation is not armed or no Batch/Jar is selected." 
      - variables:
          pending_action: "{{ states('input_select.cm2_pending_action') }}"
          client_event_id: "{{ now().timestamp() }}-{{ range(100000,999999) | random }}"
      - choose:
          - conditions: "{{ pending_action == 'none' }}"
            sequence:
              - action: persistent_notification.create
                data:
                  title: "CM2 commit refused"
                  message: "Select a pending action before confirming. No LDS record was changed."
                  notification_id: cm2_commit_refused
              - stop: "No pending action selected."
          - conditions: "{{ pending_action == 'transfer_dark_to_light' }}"
            sequence:
              - action: script.cm2_transfer_dark_to_light
                data:
                  client_event_id: "{{ client_event_id }}"
          - conditions: "{{ pending_action == 'visual_inspection' }}"
            sequence:
              - action: script.cm2_log_observation
                data:
                  client_event_id: "{{ client_event_id }}"
          - conditions: "{{ pending_action == 'contamination' }}"
            sequence:
              - action: script.cm2_log_contamination
                data:
                  client_event_id: "{{ client_event_id }}"
          - conditions: "{{ pending_action == 'harvest' }}"
            sequence:
              - action: script.cm2_log_harvest
                data:
                  client_event_id: "{{ client_event_id }}"
          - conditions: "{{ pending_action == 'cleaning' }}"
            sequence:
              - action: script.cm2_log_cleaning
                data:
                  client_event_id: "{{ client_event_id }}"
          - conditions: "{{ pending_action == 'discard' }}"
            sequence:
              - action: script.cm2_log_discard
                data:
                  client_event_id: "{{ client_event_id }}"
          - conditions: "{{ pending_action == 'final_yield' }}"
            sequence:
              - action: script.cm2_log_final_yield
                data:
                  client_event_id: "{{ client_event_id }}"
          - conditions: "{{ pending_action == 'inoculation' }}"
            sequence:
              - action: rest_command.cm2_post_event
                data:
                  lds_base_url: !secret lds_base_url
                  lds_token: !secret lds_token
                  payload: >-
                    {% set is_jar = '-J' in selected_id %}
                    {{ {
                      'ts': now().isoformat(), 'batch_id': selected_id.split('-J')[0] if is_jar else selected_id,
                      'jar_id': selected_id if is_jar else none, 'action': 'inoculation', 'to_stage': 'inoculated',
                      'operator': states('input_select.cm2_operator'), 'notes': states('input_text.cm2_notes'),
                      'data_source': 'qr_scan', 'client_event_id': client_event_id
                    } | tojson }}
                response_variable: inoculation_response
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.cm2_scan_confirm_armed
      - action: script.cm2_reset_form

  cm2_transfer_dark_to_light:
    alias: "CM2 · Transfer dark incubation to light"
    icon: mdi:swap-horizontal-bold
    mode: single
    fields:
      client_event_id:
        description: "Optional caller-provided idempotency ID; generated when run directly."
    sequence:
      - variables:
          selected_id: "{{ states('input_text.cm2_selected_id') | trim }}"
          operator: "{{ states('input_select.cm2_operator') }}"
          source_location: "{{ states('input_select.cm2_source_location') }}"
          dest_chamber: "{{ states('input_select.cm2_dest_chamber') }}"
          rack_shelf: "{{ states('input_text.cm2_rack_shelf') | trim }}"
          reason: "{{ states('input_text.cm2_reason') | trim }}"
          colonization_state: "{{ states('input_number.cm2_colonization_pct') }}"
          moisture_level: "{{ states('input_select.cm2_moisture_level') }}"
          missing_fields: >-
            {% set ns = namespace(fields=[]) %}
            {% if operator in ['', 'unknown', 'unavailable', 'none', '-- select operator --'] %}{% set ns.fields = ns.fields + ['operator'] %}{% endif %}
            {% if source_location in ['', 'unknown', 'unavailable', 'none', '-- select chamber --'] %}{% set ns.fields = ns.fields + ['source_location'] %}{% endif %}
            {% if dest_chamber in ['', 'unknown', 'unavailable', 'none', '-- select chamber --'] %}{% set ns.fields = ns.fields + ['dest_chamber'] %}{% endif %}
            {% if rack_shelf in ['', 'unknown', 'unavailable', 'none'] %}{% set ns.fields = ns.fields + ['rack_shelf'] %}{% endif %}
            {% if reason in ['', 'unknown', 'unavailable', 'none'] %}{% set ns.fields = ns.fields + ['reason'] %}{% endif %}
            {% if colonization_state in ['', 'unknown', 'unavailable', 'none'] %}{% set ns.fields = ns.fields + ['colonization_pct'] %}{% endif %}
            {% if moisture_level in ['', 'unknown', 'unavailable', 'none', '-- select moisture --'] %}{% set ns.fields = ns.fields + ['moisture_level'] %}{% endif %}
            {{ ns.fields | join(', ') }}
      - choose:
          - conditions: "{{ missing_fields | trim != '' }}"
            sequence:
              - action: persistent_notification.create
                data:
                  title: "CM2 transfer blocked — required fields missing"
                  message: "Missing: {{ missing_fields }}. No LDS transfer was created."
                  notification_id: cm2_transfer_missing_fields
              - stop: "Transfer aborted: missing {{ missing_fields }}." 
      - action: script.cm2_env_payload
        data:
          chamber: "{{ dest_chamber }}"
        response_variable: env_response
      - variables:
          env_payload: "{{ env_response.env | default({}, true) }}"
          transfer_event_id: "{{ client_event_id | default(now().timestamp() ~ '-' ~ (range(100000,999999) | random), true) }}"
          event_ts: >-
            {% set configured = states('input_datetime.cm2_event_ts') %}
            {{ (configured | as_datetime | as_local).isoformat() if configured not in ['', 'unknown', 'unavailable', 'none'] else now().isoformat() }}
      - action: rest_command.cm2_post_transfer
        data:
          lds_base_url: !secret lds_base_url
          lds_token: !secret lds_token
          payload: >-
            {% set is_jar = '-J' in selected_id %}
            {{ {
              'ts': event_ts,
              'batch_id': selected_id.split('-J')[0] if is_jar else selected_id,
              'jar_ids': [selected_id] if is_jar else none,
              'operator': operator,
              'source_location': source_location,
              'dest_chamber': dest_chamber,
              'rack_shelf': rack_shelf,
              'reason': reason,
              'colonization_pct': colonization_state | float,
              'moisture_level': moisture_level,
              'env': env_payload,
              'notes': states('input_text.cm2_notes'),
              'client_event_id': transfer_event_id,
              'data_source': 'qr_scan'
            } | tojson }}
        response_variable: transfer_response
      - choose:
          - conditions: "{{ transfer_response.status | default(0) | int in [200, 201, 202] }}"
            sequence:
              - action: logbook.log
                data:
                  name: "Cordyceps Lab v2"
                  message: >-
                    Dark→light transfer committed for {{ selected_id }} from {{ source_location }} to {{ dest_chamber }} / {{ rack_shelf }}.
                  entity_id: input_text.cm2_selected_id
          - conditions: []
            sequence:
              - action: persistent_notification.create
                data:
                  title: "CM2 transfer not committed"
                  message: "LDS returned HTTP {{ transfer_response.status | default('no response', true) }}. Form retained; no local success was recorded."
                  notification_id: cm2_transfer_error
              - stop: "LDS rejected or did not confirm the transfer." 

