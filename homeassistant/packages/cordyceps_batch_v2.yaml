# =============================================================================
# CORDYCEPS LAB v2 — BATCH & LDS PACKAGE
# File: /config/packages/cordyceps_batch_v2.yaml
#
# This package is independent of the existing v1 CSV logger.  LDS is the system
# of record. No script here writes a record on scan alone: scan -> resolve ->
# visible confirmation -> commit. Configure only lds_base_url and lds_token in
# secrets.yaml; physical chamber entities are only in cm2_sensor_map.yaml.
# =============================================================================

# The REST integration needs a templatable base URL and bearer header. These
# attributes are internal transport configuration; do not add this entity to a
# dashboard. All REST commands below receive the same two secrets directly.
template:
  - sensor:
      - name: "CM2 LDS connection"
        unique_id: cm2_lds_connection
        icon: mdi:server-network
        state: "configured"
        attributes:
          base_url: !secret lds_base_url
          bearer_token: !secret lds_token

      - name: "CM2 selected batch stage"
        unique_id: cm2_selected_batch_stage
        icon: mdi:transit-connection-variant
        state: >-
          {{ state_attr('sensor.cm2_selected_timeline', 'current_stage')
             | default('unknown', true) }}

      - name: "CM2 transfer queue count"
        unique_id: cm2_transfer_queue_count
        icon: mdi:swap-horizontal-bold
        state: >-
          {% set rows = state_attr('sensor.cm2_dark_transfer_queue_data', 'batches')
             | default(state_attr('sensor.cm2_dark_transfer_queue_data', 'items'), true)
             | default([], true) %}
          {{ rows | count }}
        attributes:
          batches: >-
            {{ state_attr('sensor.cm2_dark_transfer_queue_data', 'batches')
               | default(state_attr('sensor.cm2_dark_transfer_queue_data', 'items'), true)
               | default([], true) }}

      - name: "CM2 data completeness"
        unique_id: cm2_data_completeness
        icon: mdi:database-check-outline
        unit_of_measurement: "%"
        state: >-
          {% set c = state_attr('sensor.cm2_selected_timeline', 'completeness') %}
          {% if c is number %}{{ c }}
          {% elif c is mapping %}{{ c.get('overall', c.get('score', 'unknown')) }}
          {% else %}unknown{% endif %}
        attributes:
          source_batch_id: "{{ state_attr('sensor.cm2_selected_timeline', 'batch_id') | default(none, true) }}"
          completeness_detail: "{{ state_attr('sensor.cm2_selected_timeline', 'completeness') | default(none, true) }}"

      - name: "CM2 duration autoclave to inoculation"
        unique_id: cm2_duration_autoclave_to_inoculation
        icon: mdi:timer-outline
        unit_of_measurement: "h"
        state: >-
          {% set d = state_attr('sensor.cm2_selected_timeline', 'durations')
             | default(state_attr('sensor.cm2_selected_timeline', 'stage_durations'), true)
             | default({}, true) %}
          {{ d.get('h_autoclave_to_inoculation', 'unknown') if d is mapping else 'unknown' }}

      - name: "CM2 duration inoculation to transfer"
        unique_id: cm2_duration_inoculation_to_transfer
        icon: mdi:timer-outline
        unit_of_measurement: "h"
        state: >-
          {% set d = state_attr('sensor.cm2_selected_timeline', 'durations')
             | default(state_attr('sensor.cm2_selected_timeline', 'stage_durations'), true)
             | default({}, true) %}
          {{ d.get('h_inoculation_to_transfer', 'unknown') if d is mapping else 'unknown' }}

      - name: "CM2 duration transfer to primordia"
        unique_id: cm2_duration_transfer_to_primordia
        icon: mdi:timer-outline
        unit_of_measurement: "h"
        state: >-
          {% set d = state_attr('sensor.cm2_selected_timeline', 'durations')
             | default(state_attr('sensor.cm2_selected_timeline', 'stage_durations'), true)
             | default({}, true) %}
          {{ d.get('h_transfer_to_primordia', 'unknown') if d is mapping else 'unknown' }}

      - name: "CM2 duration primordia to harvest"
        unique_id: cm2_duration_primordia_to_harvest
        icon: mdi:timer-outline
        unit_of_measurement: "h"
        state: >-
          {% set d = state_attr('sensor.cm2_selected_timeline', 'durations')
             | default(state_attr('sensor.cm2_selected_timeline', 'stage_durations'), true)
             | default({}, true) %}
          {{ d.get('h_primordia_to_harvest', 'unknown') if d is mapping else 'unknown' }}

      - name: "CM2 total cycle duration"
        unique_id: cm2_duration_total_cycle
        icon: mdi:timer-check-outline
        unit_of_measurement: "h"
        state: >-
          {% set d = state_attr('sensor.cm2_selected_timeline', 'durations')
             | default(state_attr('sensor.cm2_selected_timeline', 'stage_durations'), true)
             | default({}, true) %}
          {{ d.get('h_total_cycle', 'unknown') if d is mapping else 'unknown' }}

