automation:
  - id: cm2_scan_confirm_auto_disarm
    alias: "CM2 · Auto-disarm scan confirmation after 120 seconds"
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_boolean.cm2_scan_confirm_armed
        to: "on"
    actions:
      - delay: "00:02:00"
      - condition: state
        entity_id: input_boolean.cm2_scan_confirm_armed
        state: "on"
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.cm2_scan_confirm_armed
      - action: persistent_notification.create
        data:
          title: "CM2 scan confirmation expired"
          message: "The 120-second confirmation window expired. Resolve the QR token again before committing."
          notification_id: cm2_scan_expired

  - id: cm2_transfer_review_window_reached
    alias: "CM2 · Transfer review window reached"
    mode: single
    triggers:
      - trigger: time_pattern
        hours: "/6"
      - trigger: state
        entity_id: sensor.cm2_dark_transfer_queue_data
    actions:
      - variables:
          review_days: "{{ states('input_number.cm2_review_window_days') | float(14) }}"
          queue_rows: >-
            {{ state_attr('sensor.cm2_dark_transfer_queue_data', 'batches')
               | default(state_attr('sensor.cm2_dark_transfer_queue_data', 'items'), true)
               | default([], true) }}
      - repeat:
          for_each: "{{ queue_rows }}"
          sequence:
            - variables:
                row: "{{ repeat.item }}"
                age_days: >-
                  {% if row.incubation_age_days is defined %}{{ row.incubation_age_days }}
                  {% elif row.dark_incubation_age_days is defined %}{{ row.dark_incubation_age_days }}
                  {% elif row.incubation_age_h is defined %}{{ row.incubation_age_h | float / 24 }}
                  {% elif row.age_h is defined %}{{ row.age_h | float / 24 }}
                  {% else %}{{ none }}{% endif %}
            - choose:
                - conditions: >-
                    {{ row.current_stage | default('') == 'dark_incubation'
                       and age_days not in [none, 'unknown', 'unavailable', '']
                       and age_days | float > review_days | float }}
                  sequence:
                    - action: persistent_notification.create
                      data:
                        title: "Transfer review window reached"
                        message: >-
                          {{ row.batch_id | default(row.jar_id, true) }} is in dark_incubation for
                          {{ age_days | float | round(1) }} days (review window {{ review_days }} days).
                          Review it; this notification never transfers anything automatically.
                        notification_id: "cm2_transfer_review_{{ row.batch_id | default(row.jar_id, true) }}"
