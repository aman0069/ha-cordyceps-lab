title: Lab Operations
path: cm2-live-monitor
icon: mdi:flask-outline
type: masonry
cards:
  - type: markdown
    content: |
      # Cordyceps Lab
      ## Operations board
    card_mod:
      style: |
        ha-card {
          background: linear-gradient(135deg, #111827, #12343b 60%, #1f2937);
          border: 1px solid #28545c;
          border-left: 5px solid #2dd4bf;
          border-radius: 8px;
          padding: 8px 16px;
        }
        h1 { color: #f8fafc; letter-spacing: 0; }
        h2 { color: #8be0d2; letter-spacing: 0; }

  - type: grid
    columns: 4
    square: false
    cards:
      - type: custom:mushroom-template-card
        entity: sensor.cm2_dashboard_summary
        primary: Active batches
        secondary: "{{ state_attr('sensor.cm2_dashboard_summary', 'active_batches') | default(0) }} in cultivation"
        icon: mdi:layers-triple-outline
        icon_color: teal
      - type: custom:mushroom-template-card
        entity: sensor.cm2_dashboard_summary
        primary: Jars in motion
        secondary: "{{ state_attr('sensor.cm2_dashboard_summary', 'total_jars') | default(0) }} tracked"
        icon: mdi:beaker-outline
        icon_color: blue
      - type: custom:mushroom-template-card
        entity: sensor.cm2_dashboard_summary
        primary: Liquid cultures
        secondary: "{{ state_attr('sensor.cm2_dashboard_summary', 'active_cultures') | default(0) }} active"
        icon: mdi:flask-round-bottom-outline
        icon_color: amber
      - type: custom:mushroom-template-card
        entity: sensor.cm2_dashboard_summary
        primary: Harvest ready
        secondary: "{{ state_attr('sensor.cm2_dashboard_summary', 'harvest_ready') | default(0) }} records"
        icon: mdi:basket-check-outline
        icon_color: green

  - type: grid
    columns: 2
    square: false
    cards:
      - type: vertical-stack
        cards:
          - type: markdown
            content: "## Log a cycle"
          - type: entities
            title: Autoclave
            show_header_toggle: false
            entities:
              - entity: input_select.cm2_autoclave_material
                name: Material
              - entity: input_number.cm2_autoclave_quantity
                name: Quantity
              - entity: input_number.cm2_autoclave_temperature_c
                name: Temperature
              - entity: input_number.cm2_autoclave_pressure_psi
                name: Pressure
              - entity: input_number.cm2_autoclave_duration_min
                name: Duration
          - type: custom:mushroom-template-card
            entity: script.cm2_log_autoclave
            primary: Log autoclave cycle
            secondary: Defaults are prefilled; edit only when this cycle differs.
            icon: mdi:autoclave
            icon_color: amber
            tap_action:
              action: call-service
              service: script.turn_on
              target:
                entity_id: script.cm2_log_autoclave
      - type: vertical-stack
        cards:
          - type: markdown
            content: "## Fast paths"
          - type: grid
            columns: 2
            square: false
            cards:
              - type: button
                name: New jar batch
                icon: mdi:package-variant-plus
                tap_action:
                  action: call-service
                  service: script.turn_on
                  target:
                    entity_id: script.cm2_create_batch
              - type: button
                name: Scan a jar
                icon: mdi:qrcode-scan
                tap_action:
                  action: navigate
                  navigation_path: /lovelace/cm2-transfer-queue
              - type: button
                name: Inoculation
                icon: mdi:needle
                tap_action:
                  action: navigate
                  navigation_path: /lovelace/cm2-batch-timeline
              - type: button
                name: Harvest
                icon: mdi:basket-check
                tap_action:
                  action: navigate
                  navigation_path: /lovelace/cm2-batch-timeline
          - type: entities
            title: System status
            show_header_toggle: false
            entities:
              - entity: sensor.cm2_lds_status
                name: Data service
              - entity: sensor.cm2_transfer_queue_count
                name: Transfer queue
              - entity: input_boolean.cm2_scan_confirm_armed
                name: Scan confirmation

  - type: markdown
    content: "## Equipment and workflow"
  - type: grid
    columns: 4
    square: false
    cards:
      - type: custom:mushroom-template-card
        entity: sensor.cm2_lds_status
        primary: Data service
        secondary: "{{ states('sensor.cm2_lds_status') | title }}"
        icon: mdi:server-check-outline
        icon_color: green
      - type: custom:mushroom-template-card
        entity: sensor.cm2_transfer_queue_count
        primary: Dark room queue
        secondary: "{{ states('sensor.cm2_transfer_queue_count') }} waiting"
        icon: mdi:weather-night
        icon_color: amber
        tap_action:
          action: navigate
          navigation_path: /lovelace/cm2-transfer-queue
      - type: custom:mushroom-template-card
        entity: input_boolean.cm2_scan_confirm_armed
        primary: Scan safeguard
        secondary: "{{ states('input_boolean.cm2_scan_confirm_armed') | title }}"
        icon: mdi:shield-check-outline
        icon_color: teal
      - type: custom:mushroom-template-card
        entity: sensor.cm2_selected_batch_stage
        primary: Selected record
        secondary: "{{ states('sensor.cm2_selected_batch_stage') | replace('_', ' ') | title }}"
        icon: mdi:timeline-clock-outline
        icon_color: blue
        tap_action:
          action: navigate
          navigation_path: /lovelace/cm2-batch-timeline

  - type: grid
    columns: 2
    square: false
    cards:
      - type: vertical-stack
        cards:
          - type: markdown
            content: "## Selected record"
          - type: entities
            show_header_toggle: false
            state_color: true
            entities:
              - entity: input_text.cm2_selected_name
                name: Record
              - entity: input_text.cm2_selected_id
                name: Identifier
              - entity: sensor.cm2_selected_batch_stage
                name: Stage
              - entity: sensor.cm2_data_completeness
                name: Completeness
          - type: custom:mushroom-template-card
            entity: script.cm2_resolve_scan
            primary: Resolve scanned label
            secondary: Scan selects a record; confirmation is still required to write.
            icon: mdi:qrcode-scan
            icon_color: teal
            tap_action:
              action: call-service
              service: script.turn_on
              target:
                entity_id: script.cm2_resolve_scan
      - type: vertical-stack
        cards:
          - type: markdown
            content: "## Stage pulse"
          - type: entities
            title: Timing
            show_header_toggle: false
            entities:
              - entity: sensor.cm2_duration_autoclave_to_inoculation
                name: Autoclave to inoculation
              - entity: sensor.cm2_duration_inoculation_to_transfer
                name: Inoculation to transfer
              - entity: sensor.cm2_duration_transfer_to_primordia
                name: Transfer to primordia
              - entity: sensor.cm2_duration_primordia_to_harvest
                name: Primordia to harvest
              - entity: sensor.cm2_duration_total_cycle
                name: Total cycle

  - type: conditional
    conditions:
      - entity: sensor.cm2_transfer_queue_count
        state_not: "0"
    card:
      type: custom:mushroom-template-card
      entity: sensor.cm2_transfer_queue_count
      primary: Transfer queue needs attention
      secondary: Open the guided queue to complete one required task at a time.
      icon: mdi:clipboard-alert-outline
      icon_color: amber
      tap_action:
        action: navigate
        navigation_path: /lovelace/cm2-transfer-queue

  - type: markdown
    content: >
      ## Recent activity
      {% for item in state_attr('sensor.cm2_dashboard_summary', 'recent_activity') | default([], true) %}
      - **{{ item.event_type | replace('_', ' ') | title }}** · {{ item.source_id | default('unassigned', true) }} · {{ item.ts }}
      {% else %}
      No activity has been recorded yet.
      {% endfor %}title: Live Monitor
path: cm2-live-monitor
icon: mdi:mushroom
type: masonry
cards:
  - type: markdown
    content: |
      # Cordyceps Cultivation Lab
      **AryaGro Tech | live batch and environmental operations**
    card_mod:
      style: |
        ha-card {
          background: linear-gradient(135deg, #0f172a, #164e63 55%, #052e16);
          border-left: 3px solid #06b6d4;
          border-radius: 12px;
          box-shadow: 0 6px 20px rgba(0,0,0,0.45), 0 0 15px rgba(6,182,212,0.15);
        }

  - type: grid
    columns: 4
    square: false
    cards:
      - type: entity
        entity: sensor.cm2_lds_status
        name: LDS Status
        icon: mdi:server-check
      - type: entity
        entity: sensor.cm2_transfer_queue_count
        name: Transfer Queue
        icon: mdi:tray-arrow-right
      - type: entity
        entity: sensor.cm2_data_completeness
        name: Data Completeness
        icon: mdi:database-check-outline
      - type: entity
        entity: input_boolean.cm2_scan_confirm_armed
        name: Confirmation Armed
        icon: mdi:shield-check-outline

  - type: markdown
    content: |
      ## Selected cultivation record
    card_mod:
      style: |
        ha-card {
          background: rgba(15, 23, 42, 0.96);
          border-left: 3px solid #06b6d4;
          border-radius: 10px;
        }

  - type: grid
    columns: 2
    square: false
    cards:
      - type: entities
        title: Current record
        show_header_toggle: false
        state_color: true
        entities:
          - entity: input_text.cm2_selected_name
            name: Batch / jar
          - entity: input_text.cm2_selected_id
            name: Identifier
          - entity: sensor.cm2_selected_batch_stage
            name: Current stage
          - entity: sensor.cm2_selected_timeline
            name: Timeline data
      - type: gauge
        entity: sensor.cm2_data_completeness
        name: Record completeness
        min: 0
        max: 100
        needle: true
        severity:
          green: 90
          yellow: 70
          red: 0

  - type: custom:mushroom-chips-card
    alignment: justify
    chips:
      - type: template
        content: Autoclaved
        icon: mdi:pressure-gauge
        icon_color: >-
          {{ 'teal' if states('sensor.cm2_selected_batch_stage') == 'autoclaved' else 'grey' }}
      - type: template
        content: Inoculated
        icon: mdi:needle
        icon_color: >-
          {{ 'teal' if states('sensor.cm2_selected_batch_stage') == 'inoculated' else 'grey' }}
      - type: template
        content: Dark incubation
        icon: mdi:weather-night
        icon_color: >-
          {{ 'teal' if states('sensor.cm2_selected_batch_stage') == 'dark_incubation' else 'grey' }}
      - type: template
        content: Light
        icon: mdi:weather-sunny
        icon_color: >-
          {{ 'teal' if states('sensor.cm2_selected_batch_stage') == 'transferred_to_light' else 'grey' }}
      - type: template
        content: Primordia
        icon: mdi:sprout
        icon_color: >-
          {{ 'teal' if states('sensor.cm2_selected_batch_stage') == 'primordia_observed' else 'grey' }}
      - type: template
        content: Fruiting
        icon: mdi:mushroom
        icon_color: >-
          {{ 'teal' if states('sensor.cm2_selected_batch_stage') == 'fruiting' else 'grey' }}
      - type: template
        content: Harvested
        icon: mdi:scale
        icon_color: >-
          {{ 'teal' if states('sensor.cm2_selected_batch_stage') == 'harvested' else 'grey' }}

  - type: markdown
    content: |
      ## Cultivation timing
    card_mod:
      style: |
        ha-card {
          background: linear-gradient(135deg, #052e16, #064e3b, #0f172a);
          border-left: 3px solid #22c55e;
          border-radius: 12px;
          box-shadow: 0 6px 20px rgba(0,0,0,0.45), 0 0 15px rgba(34,197,94,0.15);
        }

  - type: grid
    columns: 3
    square: false
    cards:
      - type: statistic
        entity: sensor.cm2_duration_autoclave_to_inoculation
        name: Autoclave to inoculation
        stat_type: mean
      - type: statistic
        entity: sensor.cm2_duration_inoculation_to_transfer
        name: Inoculation to transfer
        stat_type: mean
      - type: statistic
        entity: sensor.cm2_duration_transfer_to_primordia
        name: Transfer to primordia
        stat_type: mean

  - type: entities
    title: Additional cycle timing
    show_header_toggle: false
    state_color: true
    entities:
      - entity: sensor.cm2_duration_primordia_to_harvest
        name: Primordia to harvest
      - entity: sensor.cm2_duration_total_cycle
        name: Total cycle
      - entity: sensor.cm2_selected_timeline
        name: Timeline source

  - type: conditional
    conditions:
      - entity: sensor.cm2_transfer_queue_count
        state_not: "0"
    card:
      type: custom:mushroom-template-card
      entity: sensor.cm2_transfer_queue_count
      primary: Transfer tasks waiting
      secondary: Open Transfer Queue to complete mandatory tasks one screen at a time.
      icon: mdi:clipboard-alert-outline
      icon_color: amber
      tap_action:
        action: navigate
        navigation_path: /lovelace/cm2-transfer-queue

  - type: custom:mushroom-template-card
    entity: input_text.cm2_selected_id
    primary: Open selected batch timeline
    secondary: Review stage history, locations, timestamps, and sensor completeness.
    icon: mdi:timeline-clock-outline
    icon_color: teal
    tap_action:
      action: navigate
      navigation_path: /lovelace/cm2-batch-timeline
